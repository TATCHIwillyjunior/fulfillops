name: CI/CD Quality Gate & Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# least privilege: read-only by default, jobs ask for more only if needed
permissions:
  contents: read

jobs:
  # 1) lint + unit/integration tests (with a throw-away Postgres)
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fulfillops_test
          POSTGRES_USER: fulfillops
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fulfillops -d fulfillops_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fulfillops:ci_only_password@localhost:5432/fulfillops_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply DB migrations (if any)
        run: |
          for f in db/migrations/*.sql; do
            [ -e "$f" ] && psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done || true
      - name: Lint
        run: npm run lint --if-present
      - name: Tests
        run: npm test --if-present

  # 2) build image, SBOM, vulnerability scan (BLOCKING + informational)
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: fulfillops:ci
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: fulfillops:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: sbom.spdx.json
      # BLOCKING: CRITICAL/HIGH with an available fix fails the pipeline
      - name: Trivy scan (BLOCKING - CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fulfillops:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      # INFORMATIONAL: never fails, only reported
      - name: Trivy scan (INFORMATIONAL - MEDIUM,LOW)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fulfillops:ci
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: MEDIUM,LOW

  # 3) black-box public checker against an isolated compose stack
  blackbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public checker
        if: ${{ hashFiles('tests/fulfillops_public_checker.py') != '' }}
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          python3 tests/fulfillops_public_checker.py --base-url http://localhost:8080 --concurrency --stress
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -n 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # 4) publish immutable image (tag = commit SHA) ONLY on main and ONLY if all gates passed
  publish:
    needs: [test, build-scan, blackbox]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (tag = commit SHA)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
