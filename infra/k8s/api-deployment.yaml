apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-api
  namespace: fulfillops
spec:
  replicas: 2
  # never remove an old pod before a new one is Ready -> no dropped requests
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: fulfillops-api
  template:
    metadata:
      labels:
        app: fulfillops-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # = "node" user in the image
      containers:
        - name: api
          image: fulfillops:local   # for kind: docker build -t fulfillops:local . && kind load docker-image fulfillops:local --name fulfillops
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: fulfillops-config
                  key: PORT
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "128Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "250m" }
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillops-api
  namespace: fulfillops
spec:
  type: ClusterIP
  selector:
    app: fulfillops-api
  ports:
    - port: 80
      targetPort: 8080
