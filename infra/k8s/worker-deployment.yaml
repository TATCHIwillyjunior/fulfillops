apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillops-worker
  namespace: fulfillops
spec:
  replicas: 2        # two independent worker instances (assignment requirement)
  selector:
    matchLabels:
      app: fulfillops-worker
  template:
    metadata:
      labels:
        app: fulfillops-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: migrate
          image: fulfillops:local
          imagePullPolicy: IfNotPresent
          command: ["node", "db/migrate.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
      containers:
        - name: worker
          image: fulfillops:local
          imagePullPolicy: IfNotPresent
          command: ["node", "worker/src/index.js"]
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "256Mi", cpu: "250m" }
          livenessProbe:
            httpGet: { path: /health/live, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 5
